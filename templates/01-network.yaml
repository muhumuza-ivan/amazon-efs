AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Stack 1/3 - Network foundation for the shared EFS platform. Creates a fully
  private multi-AZ VPC (no Internet Gateway, no NAT Gateway, no public subnets),
  the VPC endpoints required for Systems Manager Session Manager connectivity,
  and all three least-privilege security groups used by the storage and compute
  stacks.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project identity
        Parameters:
          - ProjectName
      - Label:
          default: Addressing
        Parameters:
          - VpcCidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
    ParameterLabels:
      ProjectName:
        default: Project name (used as the cross-stack export prefix)

Parameters:
  ProjectName:
    Type: String
    Default: efs-shared
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: >-
      Lowercase name used for resource names and as the prefix for every
      cross-stack export. The storage and compute stacks must be given the
      same value.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the VPC.

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the private subnet in the first Availability Zone.

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: CIDR block for the private subnet in the second Availability Zone.

  S3PrefixListId:
    Type: String
    Default: pl-6da54004
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      Managed prefix list for S3 in this Region, used to allow instance egress
      to the S3 gateway endpoint. The id differs per Region; find yours with
      "aws ec2 describe-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.<region>.s3".
      The default is the eu-west-1 value.

Resources:
  # ---------------------------------------------------------------------------
  # VPC
  #
  # EnableDnsSupport and EnableDnsHostnames are both mandatory: the EFS mount
  # helper and the SSM interface endpoints' private DNS names will not resolve
  # without them.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  # ---------------------------------------------------------------------------
  # Private subnets - one per Availability Zone.
  #
  # Exactly two subnets, because EFS permits only one mount target per AZ per
  # file system. Two subnets across two AZs therefore gives "a mount target in
  # each subnet in each AZ" with no wasted capacity.
  # ---------------------------------------------------------------------------
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-az1"
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-az2"
        - Key: Tier
          Value: private

  # ---------------------------------------------------------------------------
  # Route tables.
  #
  # Deliberately hold no default route. The only entries are the implicit local
  # route and the S3 gateway endpoint prefix list, which makes the absence of an
  # egress path a structural property of the template rather than a convention.
  # ---------------------------------------------------------------------------
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rtb-private-az1"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rtb-private-az2"

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ---------------------------------------------------------------------------
  # Security groups.
  #
  # Ordering note: InstanceSecurityGroup declares its egress inline (so it
  # depends on the EFS and endpoint groups), while those two groups receive
  # their ingress through standalone SecurityGroupIngress resources. That breaks
  # what would otherwise be a circular reference between the groups.
  #
  # Each group also declares at least one egress rule. Omitting SecurityGroupEgress
  # entirely would cause CloudFormation to fall back to the default allow-all
  # egress rule, which is exactly what least privilege forbids here.
  # ---------------------------------------------------------------------------
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-efs-sg"
      GroupDescription: >-
        EFS mount targets. Accepts NFS only from application instances; needs no
        egress of its own because security groups are stateful.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: No egress required; placeholder that suppresses the default allow-all rule
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-efs-sg"

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-vpce-sg"
      GroupDescription: >-
        Interface VPC endpoints for Systems Manager. Accepts HTTPS only from
        application instances; needs no egress of its own.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: No egress required; placeholder that suppresses the default allow-all rule
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpce-sg"

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-instance-sg"
      GroupDescription: >-
        Application instances. No ingress at all - Session Manager is an
        outbound-only channel, so nothing ever needs to connect inbound.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to the Systems Manager interface endpoints
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
        - Description: NFS to the EFS mount targets
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          DestinationSecurityGroupId: !Ref EfsSecurityGroup
        # Traffic to a gateway endpoint leaves the instance addressed to S3's
        # public ranges, so it is matched by security group rules like any other
        # egress. Without this rule the route table sends packets to the endpoint
        # and the security group drops them first, which looks exactly like a
        # broken endpoint. The instances need it to install amazon-efs-utils
        # from the regional Amazon Linux repository, which is hosted on S3.
        - Description: HTTPS to S3 via the gateway endpoint (Amazon Linux repositories)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-instance-sg"

  EfsIngressFromInstances:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: NFS from application instances only
      GroupId: !Ref EfsSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref InstanceSecurityGroup

  VpcEndpointIngressFromInstances:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: HTTPS from application instances only
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref InstanceSecurityGroup

  # ---------------------------------------------------------------------------
  # VPC endpoints.
  #
  # ssm + ssmmessages + ec2messages are the three interface endpoints that make
  # Session Manager work without any internet path. The S3 gateway endpoint is
  # free and is used by the SSM Agent for session artifacts and plugin content.
  # ---------------------------------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

Outputs:
  VpcId:
    Description: VPC id
    Value: !Ref Vpc
    Export:
      Name: !Sub "${ProjectName}-VpcId"

  VpcCidr:
    Description: VPC CIDR block
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${ProjectName}-VpcCidr"

  PrivateSubnet1Id:
    Description: Private subnet in the first Availability Zone
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${ProjectName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Description: Private subnet in the second Availability Zone
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${ProjectName}-PrivateSubnet2Id"

  InstanceSecurityGroupId:
    Description: Security group attached to Auto Scaling group instances
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-InstanceSecurityGroupId"

  EfsSecurityGroupId:
    Description: Security group attached to the EFS mount targets
    Value: !Ref EfsSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-EfsSecurityGroupId"

  AvailabilityZones:
    Description: Availability Zones spanned by the private subnets
    Value: !Join
      - ","
      - - !GetAtt PrivateSubnet1.AvailabilityZone
        - !GetAtt PrivateSubnet2.AvailabilityZone

  S3GatewayEndpointId:
    Description: >-
      S3 gateway endpoint. Worth surfacing because instance access to the Amazon
      Linux repositories depends on it, and a failure there looks like a broken
      package mirror rather than a networking problem.
    Value: !Ref S3GatewayEndpoint
