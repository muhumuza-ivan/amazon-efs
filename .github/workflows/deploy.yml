name: Deploy

# The whole rollout, automated. A push to main lints the templates, deploys the
# Git sync bootstrap stack in stages, and then proves the result works by
# driving the running instances through Systems Manager.
#
# Nothing here holds AWS credentials: the runner federates into
# efs-shared-github-actions-role via OIDC, and that role is only assumable from
# this repository's main branch.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "deployments/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sync_scope:
        description: How far to roll out
        default: all
        type: choice
        options:
          - network
          - network-and-storage
          - all
      run_verification:
        description: Run the end-to-end EFS verification afterwards
        default: true
        type: boolean

permissions:
  id-token: write # required to request the OIDC token
  contents: read

# Two overlapping rollouts would fight over the same stacks.
concurrency:
  group: efs-shared-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: efs-shared
  BOOTSTRAP_STACK: efs-shared-gitsync

jobs:
  lint:
    name: Lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install --disable-pip-version-check cfn-lint

      - name: Lint
        run: cfn-lint templates/*.yaml --region "$AWS_REGION"

      # Mirrors the equivalent job in lint.yml, so a push to main gets the same
      # coverage a pull request does.
      - name: Check deployment files point at real templates
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          failures = []
          for path in sorted(pathlib.Path("deployments").glob("*.yaml")):
              doc = yaml.safe_load(path.read_text())
              template = doc.get("template-file-path")
              if not template:
                  failures.append(f"{path}: missing template-file-path")
                  continue
              if not pathlib.Path(template).is_file():
                  failures.append(f"{path}: template-file-path '{template}' does not exist")
              print(f"ok  {path} -> {template}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY

  deploy:
    name: Deploy via Git sync
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.rollout.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-actions-efs-shared
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out Git sync in stages
        id: rollout
        env:
          CONNECTION_ARN: ${{ secrets.AWS_CONNECTION_ARN }}
          SYNC_SCOPE: ${{ github.event.inputs.sync_scope || 'all' }}
        run: |
          set -euo pipefail
          echo "scope=$SYNC_SCOPE" >> "$GITHUB_OUTPUT"

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"

          stack_status () {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NOT_FOUND
          }

          # The deployment file is the single source of truth for what a stack is
          # made of, so read the template path, parameters and tags straight out
          # of the same file Git sync reads. Parsed with awk rather than a YAML
          # library so the job needs no Python packages installed.
          dep_template () { awk '/^template-file-path:/ {print $2; exit}' "$1"; }
          dep_section () {
            awk -v sect="$2" '
              /^[a-z][a-z-]*:/ { inside = ($0 ~ "^" sect ":"); next }
              inside && /^  [A-Za-z]/ { sub(/^  /, ""); sub(/: */, "="); print }
            ' "$1" | tr "\n" " "
          }

          # Git sync only ever creates a change set against an existing stack, so
          # a stack must exist before a sync configuration can manage it.
          #
          # The stack is created with --role-arn, which makes CloudFormation
          # assume the provisioning role to do the work. That is why this
          # workflow's own role holds no EC2, EFS or Auto Scaling permissions and
          # still deploys the infrastructure: it passes a role rather than
          # wielding one. The same role provisions whether the trigger is this
          # pipeline or a Git sync.
          #
          # Once the stack exists this is a no-op and Git sync owns every update,
          # which keeps the two from racing each other on the same stack.
          ensure_stack () {
            local name="$1" depfile="$2" caps="${3:-}" status tmpl params tags
            status=$(stack_status "$name")
            if [ "$status" != "NOT_FOUND" ]; then
              echo "$name exists ($status) - Git sync owns updates"
              return 0
            fi
            tmpl=$(dep_template "$depfile")
            params=$(dep_section "$depfile" parameters)
            tags=$(dep_section "$depfile" tags)
            echo "creating $name from $tmpl via $PROVISION_ROLE_ARN"
            # shellcheck disable=SC2086
            aws cloudformation deploy \
              --stack-name "$name" \
              --template-file "$tmpl" \
              --role-arn "$PROVISION_ROLE_ARN" \
              --no-fail-on-empty-changeset \
              ${caps:+--capabilities $caps} \
              ${params:+--parameter-overrides $params} \
              ${tags:+--tags $tags}
          }

          deploy_scope () {
            echo "::group::bootstrap -> SyncScope=$1"
            aws cloudformation deploy \
              --stack-name "$BOOTSTRAP_STACK" \
              --template-file templates/00-gitsync.yaml \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                ConnectionArn="$CONNECTION_ARN" \
                GitHubOwner="$owner" \
                RepositoryName="$repo" \
                BranchName=main \
                ProjectName="$PROJECT_NAME" \
                SyncScope="$1"
            echo "::endgroup::"
          }

          # Git sync refuses to touch a stack that was changed by anything other
          # than itself, recording an AUTOMATED sync blocker: "modified by
          # something besides StackSync. Disabling syncing to ensure we don't
          # overwrite an important deployment." That is a sensible default, but
          # it fires by construction here, because the pipeline creates each
          # stack with `aws cloudformation deploy` before handing it over. Left
          # alone it would block the very first sync of every stack, forever.
          #
          # Clearing it is safe in this repository precisely because Git is the
          # source of truth: whatever Git sync would overwrite came from an
          # earlier commit of these same templates. It would NOT be safe in a
          # repository where people also deploy by hand - there the blocker is
          # doing its job and should be investigated rather than cleared.
          clear_blockers () {
            local name="$1" ids id
            ids=$(aws codeconnections get-sync-blocker-summary --sync-type CFN_STACK_SYNC \
                    --resource-name "$name" \
                    --query 'SyncBlockerSummary.LatestBlockers[?Status==`ACTIVE`].Id' \
                    --output text 2>/dev/null || echo "")
            [ -z "$ids" ] && return 0
            for id in $ids; do
              echo "resolving sync blocker $id on $name"
              aws codeconnections update-sync-blocker --id "$id" \
                --sync-type CFN_STACK_SYNC --resource-name "$name" \
                --resolved-reason "Stack created by the deployment pipeline; this repository is the source of truth" \
                >/dev/null
            done
          }

          # Creating a sync configuration triggers a sync immediately, so wait on
          # the sync's own status rather than guessing from the stack. Requiring
          # the synced SHA to match this commit stops a stale SUCCEEDED from a
          # previous run being mistaken for this one.
          wait_sync () {
            local name="$1" status sha synced="" cleared=""
            echo "waiting for Git sync to apply $name"
            for _ in $(seq 1 60); do
              status=$(aws codeconnections get-resource-sync-status --sync-type CFN_STACK_SYNC \
                        --resource-name "$name" --query 'LatestSync.Status' --output text 2>/dev/null || echo NONE)
              sha=$(aws codeconnections get-resource-sync-status --sync-type CFN_STACK_SYNC \
                        --resource-name "$name" --query 'LatestSync.TargetRevision.Sha' --output text 2>/dev/null || echo "")
              if [ "$status" = "SUCCEEDED" ] && [ "$sha" = "$GITHUB_SHA" ]; then
                synced=yes
                break
              fi
              if [ "$status" = "FAILED" ]; then
                # A blocker is the one failure worth retrying: it means the sync
                # was refused rather than attempted. Clear it once and keep
                # waiting; anything else is a real failure and stops the run.
                if [ -z "$cleared" ]; then
                  cleared=yes
                  if clear_blockers "$name" | grep -q "resolving sync blocker"; then
                    echo "cleared a sync blocker on $name, waiting for the sync to resume"
                    sleep 20
                    continue
                  fi
                fi
                echo "::error::Git sync failed for $name"
                aws codeconnections get-resource-sync-status --sync-type CFN_STACK_SYNC \
                  --resource-name "$name" --query 'LatestSync.Events[].Event' --output text || true
                exit 1
              fi
              sleep 20
            done
            if [ -z "$synced" ]; then
              echo "::error::timed out waiting for Git sync on $name (last status: $status)"
              exit 1
            fi

            # The change set keeps executing after the sync reports success.
            for _ in $(seq 1 90); do
              status=$(stack_status "$name")
              case "$status" in
                *ROLLBACK*|*FAILED*)
                  echo "::error::$name reached $status"
                  aws cloudformation describe-stack-events --stack-name "$name" \
                    --query 'StackEvents[?contains(ResourceStatus,`FAILED`)].[LogicalResourceId,ResourceStatusReason]' \
                    --output text | head -20 || true
                  exit 1 ;;
                *_COMPLETE)
                  echo "$name: $status"
                  return 0 ;;
                *)
                  sleep 20 ;;
              esac
            done
            echo "::error::timed out waiting for $name to finish updating"
            exit 1
          }

          # Scope "none" creates only the repository link and the provisioning
          # role. That role has to exist before any stack can be deployed with
          # --role-arn, and its sync configurations cannot be created until their
          # target stacks exist - hence the ordering below.
          if [ "$(stack_status "$BOOTSTRAP_STACK")" = "NOT_FOUND" ]; then
            deploy_scope none
          fi
          PROVISION_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK" \
            --query 'Stacks[0].Outputs[?OutputKey==`GitSyncRoleArn`].OutputValue' \
            --output text)
          echo "provisioning role: $PROVISION_ROLE_ARN"

          ensure_stack "${PROJECT_NAME}-network" deployments/network.yaml
          clear_blockers "${PROJECT_NAME}-network"
          deploy_scope network
          wait_sync "${PROJECT_NAME}-network"

          if [ "$SYNC_SCOPE" != "network" ]; then
            ensure_stack "${PROJECT_NAME}-storage" deployments/storage.yaml
            clear_blockers "${PROJECT_NAME}-storage"
            deploy_scope network-and-storage
            wait_sync "${PROJECT_NAME}-storage"
          fi

          if [ "$SYNC_SCOPE" = "all" ]; then
            ensure_stack "${PROJECT_NAME}-compute" deployments/compute.yaml CAPABILITY_NAMED_IAM
            clear_blockers "${PROJECT_NAME}-compute"
            deploy_scope all
            wait_sync "${PROJECT_NAME}-compute"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Stacks"
            echo
            echo "| Stack | Status |"
            echo "|---|---|"
            for s in gitsync network storage compute; do
              status=$(aws cloudformation describe-stacks --stack-name "${PROJECT_NAME}-${s}" \
                        --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "not created")
              echo "| ${PROJECT_NAME}-${s} | ${status} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify EFS is shared
    needs: deploy
    if: needs.deploy.outputs.scope == 'all' && github.event.inputs.run_verification != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-actions-efs-verify
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for instances to register with Systems Manager
        run: |
          set -euo pipefail
          asg="${PROJECT_NAME}-asg"
          for _ in $(seq 1 30); do
            ids=$(aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-names "$asg" \
                    --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
                    --output text)
            if [ -n "$ids" ]; then
              online=$(aws ssm describe-instance-information \
                        --filters "Key=InstanceIds,Values=$(echo "$ids" | tr '\t' ',')" \
                        --query 'length(InstanceInformationList[?PingStatus==`Online`])' --output text 2>/dev/null || echo 0)
              echo "InService: $(echo "$ids" | wc -w), Online in SSM: $online"
              [ "$online" -ge 2 ] && exit 0
            fi
            sleep 20
          done
          echo "::error::instances did not register with Systems Manager in time"
          exit 1

      - name: Run end-to-end verification
        run: |
          chmod +x scripts/verify-efs.sh
          scripts/verify-efs.sh "$PROJECT_NAME" "$AWS_REGION" | tee verification.txt

      - name: Publish verification output
        if: always()
        run: |
          {
            echo "## EFS verification"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' verification.txt 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
